# Pause swayidle whenever any window is fullscreen — covers games (Steam,
# gamescope), video (mpv, browser fullscreen), presentations. Fixes the case
# where controller-only input (no kb/mouse) lets the screen lock mid-game.
# Two rules to cover both backends: class is set on XWayland windows, app_id
# on native Wayland. `".*"` matches the empty string so both rules fire for
# every window — applying the inhibitor twice is idempotent and harmless.
for_window [class=".*"]  inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen
